name: Product initiative
description: A product-owned brief describing a possible piece of work, large or small.
type: Initiative
projects: ["viio-io/10"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: >-
        What we're doing and why it's worth doing. Where the shape is already clear,
        say roughly how. Three or four sentences.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Need / Problem / Opportunity
      description: >-
        The case for it, in plain language: what customers can't do today, who feels it,
        and what makes it a priority now. Describe needs in words; links and quotes go in
        Evidence.
      placeholder: |
        Customers can record only one agreement per app, so a true-up and next year's
        renewal can't both live in Viio and one ends up in a notes field. Trial accounts
        meet this while setting up contracts, which makes it an evaluation problem as much
        as an annoyance for existing customers.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        Optional. The needs from the product hub behind this: each linked by its ID, with
        its title and one-line description, and up to three quotes beneath. List several
        if this covers several. Other notes can follow them, such as usage data, a
        competitor's release, or feedback the hub doesn't hold. Add evidence as it comes in.
      placeholder: |
        - [NEED-0000](https://github.com/viio-io/product-hub/blob/main/needs/NEED-0000.md) — **Record a second agreement on one app.** An app holds one agreement. Customers with a true-up and a renewal on the same app can represent only one of them.
          - Example Co (trial) — "We have two agreements for this app. Where do I add the second one?" (2026-07-24)
        - Example Rival lets customers attach several agreements to one app (release notes, 2026-06-30)
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: >-
        The proposed approach — or the options still on the table, if we haven't picked
        one — and the boundaries of what this does and doesn't cover.
    validations:
      required: false

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: What we haven't decided or don't yet know.
    validations:
      required: false

  - type: textarea
    id: launch
    attributes:
      label: Launch
      description: >-
        How this reaches customers, who sees it first, and what needs to change outside
        the product.
    validations:
      required: false
