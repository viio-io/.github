name: Spike Task
description: An investigation or research
projects: ["viio-io/4"]
type: Spike
body:
  - type: markdown
    attributes:
      value: "Thank you for initiating a spike task. Please provide detailed information to help guide the investigation."
  - type: textarea
    attributes:
      label: Description
      description: "What needs to be investigated and why. Include the specific questions to answer."
      placeholder: "What is the goal of this spike?"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Motivation and Context
      description: "Why this investigation is needed before implementation can proceed."
      placeholder: "Provide any relevant background or context."
    validations:
      required: false
  - type: textarea
    attributes:
      label: Scope
      description: "Investigation areas as a checklist, and what is out of scope."
      placeholder: "- [ ] Investigation area 1\n- [ ] Investigation area 2"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Deliverables
      description: "What the spike produces: a working PoC, documentation of the findings, a recommended approach."
      placeholder: "- Technical documentation covering findings\n- Recommendations for implementation approach"
    validations:
      required: true
